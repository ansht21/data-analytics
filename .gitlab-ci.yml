stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHON_VERSION: "3.12"

default:
  image: python:$PYTHON_VERSION-slim
  before_script:
    - pip install --quiet --upgrade pip

cache:
  paths:
    - .pip-cache/

lint:
  stage: lint
  before_script:
    - pip install --quiet ruff mypy pandas openpyxl pyarrow pyyaml
  script:
    - ruff check src tests run_pipeline.py streamlit_app
    - mypy src

test:
  stage: test
  before_script:
    - pip install --quiet -r requirements.txt -r requirements-dev.txt
  script:
    - pytest --cov=src --cov-report=term-missing --cov-fail-under=80
  coverage: '/TOTAL.*?(\d+\.\d+)\%$/'

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -t weekly-revenue-reconciliation-engine:$CI_COMMIT_SHORT_SHA .
    - docker run --rm weekly-revenue-reconciliation-engine:$CI_COMMIT_SHORT_SHA
        python -c "from src.config import load_settings; print('config OK')"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
