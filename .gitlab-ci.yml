stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --upgrade pip

cache:
  paths:
    - .cache/pip/

# ---------------------------------------------------------------------------
# Weekly Revenue Reconciliation Engine
# ---------------------------------------------------------------------------
engine-lint:
  stage: lint
  before_script:
    - pip install --quiet ruff mypy pandas openpyxl pyarrow pyyaml
  script:
    - cd weekly-revenue-reconciliation-engine
    - ruff check src tests scripts run_pipeline.py streamlit_app
    - mypy src

engine-test:
  stage: test
  before_script:
    - cd weekly-revenue-reconciliation-engine
    - pip install --quiet -r requirements.txt -r requirements-dev.txt
  script:
    - pytest --cov=src --cov-report=term-missing --cov-fail-under=80
  coverage: '/TOTAL.*?(\d+\.\d+)\%$/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ---------------------------------------------------------------------------
# Pipeline Contract Agent
# ---------------------------------------------------------------------------
contract-agent-test:
  stage: test
  before_script:
    - cd pipeline-contract-agent
    - pip install --quiet -r requirements.txt
  script:
    - python fixtures/make_fixtures.py
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
