stages:
  - validate
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

validate-python:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m py_compile supply-chain-performance-analysis/src/build_excel_dashboard.py
    - python -m py_compile supply-chain-performance-analysis/src/render_supply_charts.py
    - python -m py_compile subscription-retention-analytics/src/build_churn_dashboard.py
    - python -m py_compile subscription-retention-analytics/src/render_dashboard_screenshot.py
  only:
    - main
    - merge_requests

lint-code:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8
    - flake8 --max-line-length=120 --ignore=E501,W503,E302,E303,E266,E265 .
  allow_failure: true
