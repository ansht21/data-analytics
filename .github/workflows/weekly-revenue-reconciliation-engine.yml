name: weekly-revenue-reconciliation-engine
on:
  push: {paths: ["weekly-revenue-reconciliation-engine/**"]}
  pull_request: {paths: ["weekly-revenue-reconciliation-engine/**"]}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: weekly-revenue-reconciliation-engine}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      - run: ruff check src tests scripts run_pipeline.py streamlit_app
      - run: mypy src
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: weekly-revenue-reconciliation-engine}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py --no-excel
