[pytest]
# Monorepo test configuration.
#
# Each project ships its own `src/` package, so the top-level package name
# "src" would collide across projects. We therefore:
#   1. add every project root to sys.path (pythonpath), and
#   2. treat `src` as a PEP 420 namespace package (no __init__.py), so
#      `src.analytics`, `src.config`, `src.validate` etc. all resolve.
#
# Run everything:      pytest
# Run one project:    pytest pipeline-contract-agent/tests
# Run one project:    cd pipeline-contract-agent && pytest
pythonpath =
    pipeline-contract-agent
    weekly-revenue-reconciliation-engine
consider_namespace_packages = true
addopts = --import-mode=importlib
testpaths =
    pipeline-contract-agent/tests
    weekly-revenue-reconciliation-engine/tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    site-packages
    .mypy_cache
    .pytest_cache
    .ruff_cache
