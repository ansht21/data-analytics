name: pipeline-contract-agent
on:
  push: {paths: ["pipeline-contract-agent/**"]}
  pull_request: {paths: ["pipeline-contract-agent/**"]}
  schedule: [{cron: "0 6 * * *"}]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: pipeline-contract-agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python fixtures/make_fixtures.py
      - run: pytest -q
  daily-batch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: pipeline-contract-agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python src/ingest_sim.py --inject-drift all
      - run: python -m src.pipeline --batch data/batches/orders_batch_*.csv || true
      - uses: actions/upload-artifact@v4
        with: {name: incidents, path: pipeline-contract-agent/incidents/}
