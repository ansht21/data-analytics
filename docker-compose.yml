services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - STREAMLIT_SERVER_HEADLESS=true

  pipeline:
    build: .
    command: python run_pipeline.py
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
